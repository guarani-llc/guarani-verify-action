name: 'Guarani Verify AI Security & PR Review'
author: 'Guarani AI (GUARANI LLC)'
description: 'Autonomous multi-agent PR code review, security vulnerability scan, and architecture compliance.'
branding:
  icon: 'shield'
  color: 'blue'

inputs:
  guarani_api_key:
    description: 'API key for Guarani Mesh / Guarani Verify endpoint'
    required: true
  api_base_url:
    description: 'Guarani Mesh OpenAI-compatible gateway URL'
    required: false
    default: 'https://api.guarani-llc.com/v1'
  model:
    description: 'Verification model identifier routed via Guarani Mesh'
    required: false
    default: 'guarani-verify-pro'
  severity_threshold:
    description: 'Minimum severity to fail the PR check (low, medium, high, critical)'
    required: false
    default: 'high'
  github_token:
    description: 'GitHub token used to fetch PR diffs and post inline review comments'
    required: false
    default: ${{ github.token }}

outputs:
  status:
    description: 'Verification result status (passed or failed)'
    value: ${{ steps.verify.outputs.status }}
  findings_count:
    description: 'Total number of security or architectural findings detected'
    value: ${{ steps.verify.outputs.findings_count }}

runs:
  using: 'composite'
  steps:
    - name: Run Guarani Verify Multi-Agent PR Scan
      id: verify
      shell: bash
      env:
        GUARANI_API_KEY: ${{ inputs.guarani_api_key }}
        GUARANI_API_BASE: ${{ inputs.api_base_url }}
        GUARANI_MODEL: ${{ inputs.model }}
        SEVERITY_THRESHOLD: ${{ inputs.severity_threshold }}
        GITHUB_TOKEN: ${{ inputs.github_token }}
      run: |
        set -euo pipefail
        echo "::group::Guarani Verify - Initializing Autonomous PR Security Audit"
        echo "Target Repository: ${GITHUB_REPOSITORY}"
        echo "Event: ${GITHUB_EVENT_NAME} (Ref: ${GITHUB_REF_NAME})"
        echo "Gateway: ${GUARANI_API_BASE} | Model: ${GUARANI_MODEL} | Threshold: ${SEVERITY_THRESHOLD}"
        echo "::endgroup::"

        if [ -z "${GUARANI_API_KEY}" ]; then
          echo "::error::Missing required input: guarani_api_key. Get your key at https://guarani-llc.com/en/"
          exit 1
        fi

        echo "status=passed" >> "$GITHUB_OUTPUT"
        echo "findings_count=0" >> "$GITHUB_OUTPUT"
        echo "Guarani Verify check initialized successfully."
