name: 'Guarani Verify AI Security & PR Review'
author: 'Guarani AI (GUARANI LLC)'
description: 'Run Guarani Verify for a repository and report its policy verdict.'
branding:
  icon: 'shield'
  color: 'blue'
inputs:
  token:
    description: 'Workspace access token (GUARANI_TOKEN) issued to your Guarani AI workspace.'
    required: true
  profile:
    description: 'Profile defined in guarani.yml, for example pull-request or release.'
    required: false
    default: 'pull-request'
  repo:
    description: 'Repository to verify in owner/name format.'
    required: false
    default: ${{ github.repository }}
  ref:
    description: 'Git ref to verify, for example refs/pull/1842/head.'
    required: false
    default: ${{ github.ref }}
  report:
    description: 'Report target: github, gitlab, or markdown.'
    required: false
    default: 'github'
  api_url:
    description: 'Guarani AI REST API base URL.'
    required: false
    default: 'https://api.guarani-llc.com/v1'
outputs:
  id:
    description: 'Verification run ID, for example ver_01JB7Q4M2XK8.'
    value: ${{ steps.verify.outputs.id }}
  verdict:
    description: 'Final release verdict returned by policy rules: CLEARED or HOLD.'
    value: ${{ steps.verify.outputs.verdict }}
  findings_count:
    description: 'Number of findings returned by the verification run.'
    value: ${{ steps.verify.outputs.findings_count }}
runs:
  using: 'composite'
  steps:
    - name: Run Guarani Verify
      id: verify
      shell: bash
      env:
        GUARANI_TOKEN: ${{ inputs.token }}
        INPUT_PROFILE: ${{ inputs.profile }}
        INPUT_REPO: ${{ inputs.repo }}
        INPUT_REF: ${{ inputs.ref }}
        INPUT_REPORT: ${{ inputs.report }}
        INPUT_API_URL: ${{ inputs.api_url }}
      run: node "$GITHUB_ACTION_PATH/scripts/verify.mjs"
